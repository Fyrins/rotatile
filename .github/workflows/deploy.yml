name: Deploy to wordpress.org

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a tag. This job holds the SVN
      # credentials, and a tag is a movable reference: whatever it pointed at
      # tomorrow would publish under the maintainer's wordpress.org account.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version lives in four places. A release where they disagree ships a
      # package the plugin directory reads one way and the update checker reads
      # another, so this runs before anything is published and fails the whole
      # job rather than warning about it.
      - name: Check that every version agrees with the tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG_NAME' is not of the form vX.Y.Z."
            exit 1
          fi

          TAG_VERSION="${TAG_NAME#v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

          HEADER_VERSION=$(awk '/^ \* Version:/ { print $3; exit }' rotatile.php)
          CONSTANT_VERSION=$(awk -F"'" '/^define\( .ROTATILE_VERSION./ { print $4; exit }' rotatile.php)
          README_VERSION=$(awk '/^Stable tag:/ { print $3; exit }' readme.txt)

          echo "Git tag .................. $TAG_VERSION"
          echo "Plugin header ............ $HEADER_VERSION"
          echo "ROTATILE_VERSION  $CONSTANT_VERSION"
          echo "readme.txt Stable tag .... $README_VERSION"

          STATUS=0
          for pair in "plugin header:$HEADER_VERSION" \
                      "ROTATILE_VERSION:$CONSTANT_VERSION" \
                      "readme.txt Stable tag:$README_VERSION"; do
            label="${pair%%:*}"
            value="${pair#*:}"
            if [[ -z "$value" ]]; then
              echo "::error::Could not read the version from the $label."
              STATUS=1
            elif [[ "$value" != "$TAG_VERSION" ]]; then
              echo "::error::The $label says '$value' but the tag says '$TAG_VERSION'."
              STATUS=1
            fi
          done

          # 'trunk' is refused for a new plugin, and it would make the directory
          # serve whatever is in trunk instead of this release.
          if [[ "$README_VERSION" == "trunk" ]]; then
            echo "::error::readme.txt Stable tag is 'trunk'."
            STATUS=1
          fi

          # Checked here rather than at release time: once the package is on
          # wordpress.org, a missing changelog section can only be fixed by
          # shipping another version.
          if ! grep -qF "## [$TAG_VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG_VERSION]' section."
            STATUS=1
          fi

          if ! grep -qF "= $TAG_VERSION =" readme.txt; then
            echo "::error::readme.txt has no '= $TAG_VERSION =' changelog entry."
            STATUS=1
          fi

          exit "$STATUS"

      # The editor bundle is not in the repository, so it has to be built here.
      # Without this step the action would happily publish a package whose
      # editor script does not exist, and the Rotation panel would simply never
      # appear for anyone who installed the release.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build the editor script
        run: |
          npm ci
          npm run build

      - name: Refuse to publish without the built script
        run: |
          set -euo pipefail
          test -f build/editor.js
          test -f build/editor.asset.php
          EXPECTED=$(php -r "echo md5('build/editor.js');")
          if [ ! -f "languages/rotatile-fr_FR-$EXPECTED.json" ]; then
            echo "::error::Translation JSON does not match build/editor.js. Run npm run i18n."
            exit 1
          fi

      # The action reads .distignore itself to build what it commits, which now
      # includes build/ and excludes src/, and pushes .wordpress-org/ to SVN's
      # assets/ directory. The two secrets are created by hand by the
      # maintainer; see CONTRIBUTING.md. Until they exist this step fails, which
      # is the correct outcome.
      #
      # Pinned to the SHA of 2.3.0, for the reason given on the checkout step.
      - name: Deploy to the plugin directory
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: rotatile

      # Only after the directory has the release, so a failed publish does not
      # leave a GitHub release pointing at something that was never shipped.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Everything between this version's heading and the next one.
          NOTES=$(awk -v v="## [$TAG_VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/   { exit }
            found               { print }
          ' CHANGELOG.md)

          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "::error::No changelog body found for $TAG_VERSION."
            exit 1
          fi

          printf '%s\n\nOn the plugin directory: https://wordpress.org/plugins/rotatile/\n' \
            "$NOTES" > "$RUNNER_TEMP/notes.md"

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
